version: 2

sources:
  - name: raw
    schema: raw
    description: Untransformed NASA C-MAPSS files loaded by scripts/ingest.py (one batch_id per load).
    tables:
      - name: cmapss_train
        description: Run-to-failure trajectories (each engine runs until failure).
        data_tests:
          - has_columns:
              arguments:
                columns: [subset, unit_id, cycle, op_setting_1, op_setting_2, op_setting_3,
                        sensor_1, sensor_2, sensor_3, sensor_4, sensor_7, sensor_9, sensor_11,
                        sensor_21, batch_id, loaded_at]
      - name: cmapss_test
        description: Truncated trajectories; true RUL at the last cycle is in cmapss_rul.
        data_tests:
          - has_columns:
              arguments:
                columns: [subset, unit_id, cycle, op_setting_3, sensor_2, sensor_21, batch_id]
      - name: cmapss_rul
        description: Ground-truth RUL at the final observed cycle of each test engine.
        columns:
          - name: rul_true
            data_tests: [not_null, {in_range: {arguments: {min_value: 0, max_value: 1000}}}]
