name: deploy
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
      TF_VAR_model_version: lstm-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_lambda.py
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra
        run: terraform init -input=false && terraform apply -auto-approve -input=false
      - name: Smoke test deployed API
        working-directory: infra
        run: curl -sf "$(terraform output -raw api_url)health"
