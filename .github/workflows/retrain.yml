name: retrain
# Weekly: quality gate -> drift check on the incoming batch -> retrain only if drift is detected (or forced).
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      batch:
        description: "Incoming batch to check against the training reference"
        type: choice
        options: [FD001_new, FD002]
        default: FD002
      force:
        description: "Retrain even without drift"
        type: boolean
        default: false

jobs:
  drift-and-retrain:
    runs-on: ubuntu-latest
    env:
      TG_FEATURE_SOURCE: dbt   # CI builds features with dbt on DuckDB (no Spark on the runner)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download C-MAPSS
        run: |
          mkdir -p data/raw && cd data/raw
          curl -sSL -o outer.zip "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
          unzip -q outer.zip && unzip -q "6. Turbofan Engine Degradation Simulation Data Set/CMAPSSData.zip" -d cmapss
      - name: Ingest + dbt build (quality gate)
        run: python scripts/run_pipeline.py --skip-train
      - name: Drift check (Evidently)
        id: drift
        run: python -m thermalguard.drift --batch "${{ inputs.batch || 'FD001_new' }}"
      - name: Retrain (classic + LSTM)
        if: steps.drift.outputs.drift_detected == 'true' || inputs.force
        run: |
          pip install -r requirements-dl.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m thermalguard.train_classic --source dbt
          python -m thermalguard.train_lstm --source dbt
      - name: Upload reports and candidate model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-${{ github.run_number }}
          path: |
            reports/
            artifacts/lstm/
