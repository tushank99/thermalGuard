[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalguard"
version = "0.1.0"
description = "Predictive maintenance & asset intelligence: RUL prediction + maintenance RAG assistant"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
