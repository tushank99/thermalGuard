[theme]
base = "light"
primaryColor = "#0B6E64"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EBE6DB"
textColor = "#1E1D1A"
linkColor = "#0B6E64"
borderColor = "#DDD6C8"
showWidgetBorder = true
baseRadius = "10px"
font = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
headingFont = "Instrument Sans:https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#1B1A17"
secondaryBackgroundColor = "#2A2924"
textColor = "#E9E4D8"
borderColor = "#34322C"
primaryColor = "#4FC1B2"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
